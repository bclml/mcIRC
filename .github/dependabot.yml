version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "meshcore"     # capped on purpose for Python 3.10 / 3.11 (2.3.16 uses 3.12-only syntax) - see requirements.txt
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
